
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eff6ff;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgb(15 23 42 / 12%);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #173b70;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        button {
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #173b70;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #24549a;
        }

        .note {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="login-card">
            <h1>Student Login</h1>

            <form class="login-form" action="#" method="post">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>

            <p class="note">Demonstration login form for HTML and CSS practice.</p>
        </section>
    </main>
</body>
</html>
